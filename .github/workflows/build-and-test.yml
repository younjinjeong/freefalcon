name: Build and Test

on:
  push:
    branches: [ develop, main, master ]
  pull_request:
    branches: [ develop, main, master ]
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release
  PLATFORM: Win32

jobs:
  build:
    name: Build FreeFalcon
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3
      with:
        msbuild-architecture: x64

    - name: Install Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1.0.0
      with:
        vulkan_version: 1.3.296.0
        cache: true
        stripdown: true

    - name: Verify Vulkan SDK
      run: |
        Write-Host "VULKAN_SDK: $env:VULKAN_SDK"
        if (Test-Path "$env:VULKAN_SDK\Include\vulkan\vulkan.h") {
          Write-Host "Vulkan SDK headers found"
        } else {
          Write-Host "ERROR: Vulkan SDK headers not found"
          exit 1
        }
      shell: powershell

    - name: Build ENet library
      run: |
        Write-Host "Building ENet networking library..."
        MSBuild src\comms\comms.vcxproj -p:Configuration=$env:BUILD_CONFIGURATION -p:Platform=$env:PLATFORM -v:minimal
      shell: powershell
      continue-on-error: true

    - name: Build Vulkan library
      run: |
        Write-Host "Building Vulkan graphics library..."
        MSBuild src\graphics\vulkan\vulkan.vcxproj -p:Configuration=$env:BUILD_CONFIGURATION -p:Platform=$env:PLATFORM -v:minimal
      shell: powershell

    - name: Compile Vulkan shaders
      run: |
        Write-Host "Compiling Vulkan shaders..."
        cd src\graphics\vulkan\shaders
        $glslc = "$env:VULKAN_SDK\Bin\glslc.exe"

        if (Test-Path $glslc) {
          Write-Host "Compiling triangle.vert..."
          & $glslc triangle.vert -o triangle_vert.spv

          Write-Host "Compiling triangle.frag..."
          & $glslc triangle.frag -o triangle_frag.spv

          if ((Test-Path triangle_vert.spv) -and (Test-Path triangle_frag.spv)) {
            Write-Host "Shaders compiled successfully"
            $vertSize = (Get-Item triangle_vert.spv).Length
            $fragSize = (Get-Item triangle_frag.spv).Length
            Write-Host "  Vertex shader: $vertSize bytes"
            Write-Host "  Fragment shader: $fragSize bytes"
          } else {
            Write-Host "ERROR: Shader compilation failed"
            exit 1
          }
        } else {
          Write-Host "ERROR: glslc compiler not found at: $glslc"
          exit 1
        }
      shell: powershell

    - name: Build FreeFalcon main executable
      run: |
        Write-Host "Building FreeFalcon main executable..."
        MSBuild src\FFViper.vcxproj -p:Configuration=$env:BUILD_CONFIGURATION -p:Platform=$env:PLATFORM -v:minimal
      shell: powershell
      continue-on-error: true

    - name: Check build artifacts
      run: |
        Write-Host "Checking build outputs..."

        $vulkanLib = "build\x86\release_win32\graphics\vulkan\vulkan.lib"
        if (Test-Path $vulkanLib) {
          $size = [math]::Round((Get-Item $vulkanLib).Length / 1KB, 2)
          Write-Host "Vulkan library built: $vulkanLib ($size KB)"
        } else {
          Write-Host "WARNING: Vulkan library not found at $vulkanLib"
        }

        if (Test-Path "build\x86\release_win32") {
          Write-Host "`nAll build outputs:"
          Get-ChildItem -Path build\x86\release_win32 -Recurse -Include *.lib,*.exe,*.dll | ForEach-Object {
            $size = [math]::Round($_.Length / 1KB, 2)
            Write-Host "  $($_.Name) - $size KB"
          }
        }
      shell: powershell

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-outputs
        path: |
          build/x86/release_win32/**/*.lib
          build/x86/release_win32/**/*.exe
          build/x86/release_win32/**/*.dll
          src/graphics/vulkan/shaders/*.spv
        retention-days: 7

  test-enet:
    name: Test ENet Networking
    runs-on: windows-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3

    - name: Build ENet test
      run: |
        Write-Host "Building ENet test suite..."
        MSBuild src\test_enet.vcxproj -p:Configuration=Debug -p:Platform=$env:PLATFORM -v:minimal
      shell: powershell
      continue-on-error: true

    - name: Run ENet tests
      run: |
        $testExe = "build\x86\debug_win32\test_enet.exe"
        if (Test-Path $testExe) {
          Write-Host "Running ENet tests..."
          & $testExe
          if ($LASTEXITCODE -eq 0) {
            Write-Host "All ENet tests passed"
          } else {
            Write-Host "ENet tests failed with exit code: $LASTEXITCODE"
            exit 1
          }
        } else {
          Write-Host "WARNING: ENet test executable not found, skipping tests"
        }
      shell: powershell
      continue-on-error: true

  report:
    name: Build Report
    runs-on: windows-latest
    needs: [build, test-enet]
    if: always()

    steps:
    - name: Generate build report
      run: |
        Write-Host "## Build Report" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "**Branch:** ${{ github.ref_name }}" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "**Commit:** ${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "**Triggered by:** ${{ github.actor }}" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "### Build Results" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "- Main Build: ${{ needs.build.result }}" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "- ENet Tests: ${{ needs.test-enet.result }}" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "### Components Built" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "- ENet Networking Library" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "- Vulkan Graphics Library" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "- Vulkan Shaders (SPIR-V)" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "- FreeFalcon Main Executable" >> $env:GITHUB_STEP_SUMMARY
      shell: powershell
